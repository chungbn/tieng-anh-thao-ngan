<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bé Ôn Tiếng Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: một cột kiểu "vở bài tập" — thẻ unit to, nút bấm to cho ngón tay bé, mỗi trò chơi chiếm trọn màn hình */
:root {
  --bg: #e7f2fd;
  --bg-dot: #cfe3f7;
  --card: #ffffff;
  --ink: #1d2742;
  --muted: #5b6785;
  --line: #d6e2f0;
  --sky: #2f7de1;
  --sun: #ffc531;
  --tomato: #f2604b;
  --leaf: #2fa865;
  --grape: #8a5cf5;
  --ok-bg: #dff6e8;
  --bad-bg: #fde4e0;
  --shadow: 0 4px 0 #c3d4e8;
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a2e; --bg-dot: #1a2642; --card: #1b2640; --ink: #eef3ff; --muted: #a5b2cf;
    --line: #2c3a5c; --sky: #5b9cf0; --sun: #ffcf55; --tomato: #ff7a66; --leaf: #47c07d; --grape: #a483ff;
    --ok-bg: #173a2a; --bad-bg: #42201d; --shadow: 0 4px 0 #0a1020; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a2e; --bg-dot: #1a2642; --card: #1b2640; --ink: #eef3ff; --muted: #a5b2cf;
  --line: #2c3a5c; --sky: #5b9cf0; --sun: #ffcf55; --tomato: #ff7a66; --leaf: #47c07d; --grape: #a483ff;
  --ok-bg: #173a2a; --bad-bg: #42201d; --shadow: 0 4px 0 #0a1020; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; font-family: var(--body); font-size: 17px; color: var(--ink);
  background: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.5px, transparent 1.5px);
  background-size: 22px 22px;
  -webkit-tap-highlight-color: transparent;
}
#app { max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.1; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
.btn {
  border: 2px solid var(--line); background: var(--card); border-radius: 16px;
  padding: 10px 16px; font-weight: 800; box-shadow: var(--shadow); transition: transform .08s;
}
.btn:active { transform: translateY(3px); box-shadow: none; }
.btn.primary { background: var(--sky); border-color: var(--sky); color: #fff; }
.btn.sun { background: var(--sun); border-color: var(--sun); color: #1d2742; }

/* Hộp hỏi xác nhận (thay cho confirm() của trình duyệt) */
.ask { border: 0; padding: 0; background: transparent; max-width: calc(100vw - 32px); width: 380px; color: var(--ink); }
.ask::backdrop { background: rgba(20, 28, 50, .45); }
.ask[open] { animation: askIn .18s ease-out; }
@keyframes askIn { from { transform: scale(.92); opacity: 0; } }
.ask-box { background: var(--card); border: 3px solid var(--sun); border-radius: 24px; padding: 22px 20px 18px; text-align: center; box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }
.ask-ico { font-size: 52px; line-height: 1; }
.ask h3 { font-size: 26px; margin: 8px 0 4px; }
.ask p { margin: 0; font-weight: 700; color: var(--muted); line-height: 1.4; }
.ask-steps { display: flex; justify-content: center; gap: 8px; margin: 12px 0 0; }
.ask-steps i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--sun); }
.ask-steps i.on { background: var(--sun); }
.ask-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.ask-row .btn { flex: 1 1 130px; font-family: var(--display); font-size: 18px; }
@media (prefers-reduced-motion: reduce) { .ask[open] { animation: none; } }

/* Header */
.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.top .grow { flex: 1; min-width: 0; }
.brand h1 { font-size: clamp(28px, 7vw, 44px); font-weight: 800; letter-spacing: -.5px; }
.brand h1 .en { color: var(--sky); }
.brand p { margin: 2px 0 0; color: var(--muted); font-weight: 700; }
.starpill {
  display: inline-flex; align-items: center; gap: 6px; background: var(--sun); color: #1d2742;
  font-family: var(--display); font-weight: 800; font-size: 22px; padding: 4px 14px; border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.xopt { display: grid; justify-items: center; gap: 6px; margin-top: 16px; text-align: center; }
.xopt small { color: var(--muted); font-weight: 700; font-size: 14px; }
.settings { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; padding: 8px 12px; }
.toggle .sw { width: 34px; height: 20px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.toggle[aria-pressed="true"] .sw { background: var(--leaf); }
.toggle[aria-pressed="true"] .sw::after { left: 16px; }

/* Unit grid */
.section-label { font-family: var(--display); font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 8px 0 10px; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.unit {
  text-align: left; border: 0; border-radius: 22px; padding: 16px; background: var(--card);
  box-shadow: var(--shadow); display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; align-items: center;
  position: relative; overflow: hidden; min-width: 0;
}
.unit:active { transform: translateY(3px); box-shadow: none; }
.unit .ico { grid-row: span 2; width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; font-size: 36px; background: var(--c); }
.unit .no { font-family: var(--display); font-weight: 800; font-size: 14px; color: var(--c-ink, var(--muted)); letter-spacing: 1px; text-transform: uppercase; }
.unit .name { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.05; }
.unit .vi { grid-column: 2; font-size: 14px; color: var(--muted); font-weight: 700; }
.unit .meter { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); font-weight: 800; font-variant-numeric: tabular-nums; }
.unit .bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.unit .bar i { display: block; height: 100%; background: var(--sun); border-radius: 99px; }
.unit.review { background: var(--grape); color: #fff; }
.unit.review .vi, .unit.review .no, .unit.review .meter { color: #f0e9ff; }
.unit.review .ico { background: rgba(255,255,255,.2); }
.unit.review .bar { background: rgba(255,255,255,.25); }
.foot { margin-top: 28px; font-size: 13px; color: var(--muted); line-height: 1.5; max-width: 65ch; }

/* Unit page */
.back { padding: 8px 14px; }
.unit-head { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.unit-head .ico { width: 72px; height: 72px; flex: none; border-radius: 20px; display: grid; place-items: center; font-size: 42px; background: var(--c); }
.unit-head h2 { font-size: clamp(26px, 6vw, 36px); }
.unit-head p { margin: 2px 0 0; color: var(--muted); font-weight: 700; }
.acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.act { text-align: left; border: 2px solid var(--line); background: var(--card); border-radius: 18px; padding: 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); min-width: 0; }
.act:active { transform: translateY(3px); box-shadow: none; }
.act .e { font-size: 34px; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 14px; background: var(--bg); flex: none; }
.act b { font-family: var(--display); font-size: 20px; display: block; line-height: 1.1; }
.act small { color: var(--muted); font-weight: 700; font-size: 14px; }
.stars { letter-spacing: 1px; font-size: 16px; }
.stars .off { opacity: .25; filter: grayscale(1); }
.peek { margin-top: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--card); border: 2px solid var(--line); border-radius: 99px; padding: 4px 12px 4px 6px; font-weight: 800; display: inline-flex; gap: 6px; align-items: center; }
.chip .pic { width: 28px; height: 28px; font-size: 22px; }

/* Pictures */
.pic { display: inline-grid; place-items: center; line-height: 1; width: 1.2em; height: 1.2em; }
.pic svg { width: 100%; height: 100%; }
.pic .swatch { width: 80%; height: 80%; border-radius: 50%; border: 3px solid var(--line); }
.pic .num { font-family: var(--display); font-weight: 800; color: var(--sky); font-size: .9em; }

/* Game shell */
.game-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.dots { flex: 1; display: flex; gap: 6px; }
.dots i { flex: 1; height: 10px; border-radius: 99px; background: var(--line); }
.dots i.done { background: var(--leaf); }
.dots i.now { background: var(--sun); }
.prompt { background: var(--card); border-radius: 26px; padding: 22px 16px; text-align: center; box-shadow: var(--shadow); margin-bottom: 16px; }
.prompt .big { font-size: clamp(96px, 26vw, 150px); }
.prompt h3 { font-size: 22px; color: var(--muted); margin-bottom: 8px; }
.speaker { width: 112px; height: 112px; border-radius: 50%; border: 0; background: var(--sky); color: #fff; font-size: 52px; box-shadow: 0 6px 0 #1f5fb0; }
.speaker:active { transform: translateY(4px); box-shadow: none; }
.speaker.small { width: 52px; height: 52px; font-size: 24px; box-shadow: 0 4px 0 #1f5fb0; }
.opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.opt { border: 3px solid var(--line); background: var(--card); border-radius: 22px; padding: 12px; min-height: 120px; display: grid; place-items: center; box-shadow: var(--shadow); min-width: 0; }
.opt .pic { font-size: 76px; }
.opt.word { min-height: 84px; font-family: var(--display); font-weight: 800; font-size: clamp(22px, 5.5vw, 30px); overflow-wrap: anywhere; }
.opt.ok { background: var(--ok-bg); border-color: var(--leaf); }
.opt.bad { background: var(--bad-bg); border-color: var(--tomato); animation: shake .35s; }
.opt[disabled] { cursor: default; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

/* Learn cards */
.learn-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.wcard { border: 3px solid transparent; background: var(--card); border-radius: 20px; padding: 14px 8px 12px; display: grid; justify-items: center; gap: 6px; box-shadow: var(--shadow); min-width: 0; }
.wcard .pic { font-size: 64px; }
.wcard .en { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.05; text-align: center; overflow-wrap: anywhere; }
.wcard .vi { font-size: 14px; color: var(--muted); font-weight: 700; text-align: center; }
.wcard.lit { border-color: var(--sun); animation: pop .35s; }

/* Spell */
.slots { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.slot { width: 48px; height: 58px; border-bottom: 4px solid var(--line); font-family: var(--display); font-weight: 800; font-size: 40px; display: grid; place-items: center; color: var(--leaf); }
.slot.next { border-color: var(--sun); }
.tiles { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.tile { width: 58px; height: 62px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-family: var(--display); font-weight: 800; font-size: 32px; box-shadow: var(--shadow); }
.tile.used { visibility: hidden; }
.tile.bad { background: var(--bad-bg); border-color: var(--tomato); animation: shake .35s; }

/* Memory */
.mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 480px) { .mem { grid-template-columns: repeat(3, 1fr); } }
.mcard { aspect-ratio: 3 / 4; max-width: 100%; border: 0; border-radius: 16px; background: var(--sky); color: #fff; font-family: var(--display); font-size: 34px; font-weight: 800; box-shadow: var(--shadow); padding: 4px; min-width: 0; display: grid; place-items: center; }
.mcard.open, .mcard.done { background: var(--card); color: var(--ink); border: 3px solid var(--sun); animation: pop .3s; }
.mcard.done { border-color: var(--leaf); background: var(--ok-bg); }
.mcard .pic { font-size: 52px; }
.mcard .w { font-size: clamp(15px, 4vw, 21px); line-height: 1.05; overflow-wrap: anywhere; }

/* Sentences */
.sents { display: grid; gap: 10px; }
.sent { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); border: 3px solid transparent; text-align: left; width: 100%; }
.sent .pic { font-size: 44px; flex: none; }
.sent .txt { flex: 1; min-width: 0; }
.sent .en { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.2; }
.sent .vi { color: var(--muted); font-size: 14px; font-weight: 700; }
.sent.lit { border-color: var(--sun); }
.answer { min-height: 70px; border: 3px dashed var(--line); border-radius: 18px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin-bottom: 14px; }
.answer.ok { border-style: solid; border-color: var(--leaf); background: var(--ok-bg); }
.answer.bad { border-color: var(--tomato); animation: shake .35s; }
.wtile { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 8px 14px; font-family: var(--display); font-weight: 800; font-size: 24px; box-shadow: var(--shadow); }
.wtile.in { background: var(--sun); border-color: var(--sun); color: #1d2742; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

/* Finish */
.finish { text-align: center; background: var(--card); border-radius: 28px; padding: 28px 16px; box-shadow: var(--shadow); }
.finish .bigstars { font-size: clamp(54px, 15vw, 80px); letter-spacing: 6px; }
.finish .bigstars span { display: inline-block; animation: pop .5s backwards; }
.finish .bigstars span:nth-child(2) { animation-delay: .2s; }
.finish .bigstars span:nth-child(3) { animation-delay: .4s; }
.finish h2 { font-size: 36px; margin: 8px 0 4px; }
.finish p { color: var(--muted); font-weight: 700; margin: 0; }
.burst { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.burst span { position: absolute; top: -40px; font-size: 28px; animation: fall 1.8s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
/* Chọn giáo trình */
.courses { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; background: var(--card); padding: 6px; border-radius: 18px; box-shadow: var(--shadow); }
.course { border: 0; background: transparent; border-radius: 13px; padding: 10px 8px; font-family: var(--display); font-weight: 800; font-size: clamp(15px, 4vw, 19px); color: var(--muted); }
.course[aria-pressed="true"] { background: var(--sky); color: #fff; }

/* Phonics */
.abc { font-family: var(--display); font-weight: 800; font-size: 24px; color: #1d2742; letter-spacing: 1px; }
.unit.review .abc { color: #fff; }
.letters { display: grid; gap: 16px; }
.lt { background: var(--card); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); }
.lt .cards { margin-top: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 120px), 1fr)); }
.lt .wcard { background: var(--bg); box-shadow: none; }
.lt .wcard .pic { font-size: 52px; }
.lbig { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; border: 3px solid transparent; background: var(--bg); border-radius: 18px; padding: 6px 16px; }
.lbig::after { content: "🔊"; margin-left: auto; font-size: 28px; }
.lbig.lit { border-color: var(--sun); animation: pop .35s; }
.lbig .ch, .bigletter { font-family: var(--display); font-weight: 800; font-size: 68px; line-height: 1.1; color: var(--sky); }
.lbig .ch small, .bigletter small { font-size: .8em; color: var(--tomato); margin-left: 6px; }
.lbig .snd { font-family: var(--display); font-weight: 800; font-size: 28px; color: var(--muted); }
.bigletter { font-size: clamp(90px, 24vw, 130px); }
.reveal { min-height: 1.4em; margin: 8px 0; font-family: var(--display); font-size: 26px; color: var(--muted); font-weight: 800; }
.reveal .pic { font-size: 34px; vertical-align: middle; }
.opt.letter { min-height: 100px; font-family: var(--display); font-weight: 800; font-size: clamp(40px, 11vw, 60px); color: var(--sky); }
.ml { font-size: clamp(36px, 10vw, 48px); }
.notice { background: var(--bad-bg); border-radius: 14px; padding: 10px 14px; font-weight: 700; margin-bottom: 14px; }
/* Bài kiểm tra: trình bày giống đề giấy — mỗi phần một tờ, khoanh A/B/C bằng cách chạm */
.exam-cta { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border: 0; border-radius: 22px; padding: 14px 16px; margin-bottom: 20px; background: var(--leaf); color: #fff; box-shadow: var(--shadow); }
.exam-cta:active { transform: translateY(3px); box-shadow: none; }
.exam-cta .ico { width: 56px; height: 56px; flex: none; border-radius: 16px; background: rgba(255,255,255,.22); display: grid; place-items: center; font-size: 32px; }
.exam-cta b { font-family: var(--display); font-size: 22px; display: block; line-height: 1.1; }
.exam-cta small { font-weight: 700; font-size: 14px; opacity: .92; }
.exam-cta .go { margin-left: auto; font-size: 26px; font-weight: 800; }
.exam-cta.read-cta { background: var(--sky); }
.rstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rstats div { background: var(--card); border-radius: 16px; padding: 10px 6px; text-align: center; box-shadow: var(--shadow); }
.rstats b { display: block; font-family: var(--display); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.rstats small { color: var(--muted); font-weight: 700; font-size: 13px; }
.rstats .hot b { color: var(--tomato); }
.rbar { height: 12px; border-radius: 99px; background: var(--line); margin-top: 10px; overflow: hidden; }
.rbar i { display: block; height: 100%; background: var(--leaf); border-radius: inherit; }
.chip[data-say] { font: inherit; font-weight: 800; color: var(--ink); }
.rbox { min-height: 1.3em; font-size: clamp(44px, 13vw, 76px); display: grid; place-items: center; }
.rword { font-family: var(--display); font-weight: 800; letter-spacing: 2px; line-height: 1.1; overflow-wrap: anywhere; }
.rbox.gone .rword { visibility: hidden; }
.rbox.gone::after { content: "❓"; position: absolute; font-size: .7em; }
.rbox { position: relative; }
.rletters { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.rletters span { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 11vw, 64px); line-height: 1.1; padding: 0 4px; border-bottom: 4px solid var(--line); transition: color .15s, border-color .15s; }
.rletters span.lit { color: var(--sky); border-color: var(--sun); }
.rletters .sp { width: 18px; }
.rvi { margin: 6px 0 0; color: var(--muted); font-weight: 700; }
.opts.o3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opts.o3 .opt { min-height: 110px; align-content: center; gap: 4px; }
.opts.o3 .opt .pic { font-size: clamp(48px, 14vw, 72px); }
.opts.o1 { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; }
.opt.rw { min-height: 70px; font-size: clamp(28px, 8vw, 38px); letter-spacing: 1px; }
.rchip { padding: 6px 14px; font-family: var(--display); font-size: 18px; }
.aopts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.aopt { display: grid; gap: 8px; }
.aopt .play { border: 3px solid var(--line); background: var(--card); border-radius: 22px; min-height: 96px; font-size: 44px; display: grid; place-items: center; align-content: center; box-shadow: var(--shadow); }
.aopt .play small { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--muted); }
.aopt .play.on { border-color: var(--sun); background: var(--bg); }
.opt.pickb { min-height: 52px; padding: 6px; font-family: var(--display); font-weight: 800; font-size: 18px; }
.rletters.miss .gap { min-width: .62em; border-bottom: 4px dashed var(--muted); color: var(--leaf); }
.rletters.miss .gap.now { border-bottom-style: solid; border-color: var(--sun); background: var(--bg); border-radius: 8px 8px 0 0; }
.rletters.miss .gap.fill { border-bottom-style: solid; border-color: var(--leaf); }
.rletters.miss.done span { color: var(--leaf); }

const hasTTS = "speechSynthesis" in window;
let voice = null, viVoice = null;
function pickVoice() {
  if (!hasTTS) return;
  const all = speechSynthesis.getVoices(), vs = all.filter(v => /^en[-_]/i.test(v.lang));
  // Giọng tiếng Việt để đọc lời gợi ý (Linh trên Mac/iPhone, Google Tiếng Việt trên Android/Chrome)
  const vv = all.filter(v => /^vi([-_]|$)/i.test(v.lang));
  viVoice = vv.find(v => /Linh|Google/i.test(v.name)) || vv[0] || null;
  const pref = ["Samantha", "Google US English", "Microsoft Aria", "Microsoft Jenny", "Karen", "Daniel"];
  voice = pref.map(p => vs.find(v => v.name.includes(p))).find(Boolean) || vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null;
}
if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
/* File mp3 tạo sẵn bằng tools/gen-audio.mjs (Azure Neural TTS). audio/index.js khai báo AUDIO_FILES = { khóa: tên file };
   không có file nào thì mọi chỗ vẫn đọc bằng giọng của trình duyệt như cũ. */
const AUD = window.AUDIO_FILES || {};
const akey = s => String(s).toLowerCase().replace(/\s+/g, " ").replace(/^[\s.,!?]+|[\s.,!?]+$/g, "");
const hasSnd = l => !!AUD[akey(l.snd)];
const player = new Audio(); // dùng chung một phần tử: Safari chỉ cho phát tự động sau khi phần tử đã được phát bằng một lần chạm
let speakId = 0;
function stopSpeech() {
  speakId++; player.onended = player.onerror = null; player.pause();
  if (hasTTS) speechSynthesis.cancel();
}
// Cả câu có file thì phát một file; không thì tách theo dấu câu và âm /x/ ("B. /b/ /b/. bear, ball") rồi phát nối tiếp
function clipsFor(text) {
  const whole = AUD[akey(text)];
  if (whole) return [whole];
  const parts = text.split(/(?<=[.,!?])\s+|\s+(?=\/)/).map(akey).filter(Boolean);
  const files = parts.map(p => AUD[p]);
  return parts.length > 1 && files.every(Boolean) ? files : null;
}
function speak(text, onend) {
  stopSpeech();
  playEn(text, onend);
}
// Phát tiếng Anh (file mp3 nếu có, không thì giọng trình duyệt) mà không dừng lượt đọc hiện tại, để nối nhiều đoạn
function playEn(text, onend) {
  const id = speakId, clips = clipsFor(text);
  if (!clips) return ttsSpeak(text, onend);
  let fired = false;
  const done = () => { if (!fired && id === speakId) { fired = true; onend && onend(); } };
  const next = i => {
    if (id !== speakId) return;
    if (i >= clips.length) return done();
    player.src = "audio/" + clips[i];
    player.playbackRate = S.slow ? 0.8 : 1; player.preservesPitch = true;
    player.onended = () => setTimeout(() => next(i + 1), i + 1 < clips.length ? 220 : 0);
    // Lỗi tải file hoặc trình duyệt chặn phát: đọc phần còn lại bằng giọng trình duyệt
    player.onerror = () => { if (id === speakId) ttsSpeak(text, onend); };
    player.play().catch(() => { if (id === speakId) ttsSpeak(text, onend); });
  };
  next(0);
}
function ttsSpeak(text, onend) {
  text = text.replace(/\/[^/\s]+\//g, " ").replace(/\s+([.,])/g, "$1").replace(/([.,])[.,]+/g, "$1"); // giọng máy không đọc được âm /b/, bỏ đi
  if (!hasTTS) { onend && setTimeout(onend, 600); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; if (voice) u.voice = voice;
  u.rate = S.slow ? 0.72 : 0.95; u.pitch = 1.08;
  if (onend) {
    // Một số trình duyệt không gọi onend; dùng hẹn giờ dự phòng để trò chơi không bị kẹt
    let fired = false; const once = () => { if (!fired) { fired = true; onend(); } };
    u.onend = once; setTimeout(once, 1200 + text.length * (S.slow ? 110 : 80));
  }
  speechSynthesis.speak(u);
}
function ttsVi(text, onend) {
  if (!hasTTS) { onend && setTimeout(onend, 300); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "vi-VN"; if (viVoice) u.voice = viVoice;
  u.rate = S.slow ? 0.9 : 1;
  let fired = false; const once = () => { if (!fired) { fired = true; onend && onend(); } };
  u.onend = once; setTimeout(once, 1500 + text.length * 130);
  speechSynthesis.speak(u);
}
/* Đọc nối các đoạn [{ en: true/false, t }]: đoạn tiếng Anh dùng file mp3/giọng Anh, đoạn tiếng Việt dùng giọng Việt */
function speakSeq(segs) {
  stopSpeech();
  const id = speakId;
  const next = i => {
    if (id !== speakId || i >= segs.length) return;
    const g = segs[i], go = () => setTimeout(() => next(i + 1), 150);
    g.en ? playEn(g.t, go) : ttsVi(g.t, go);
  };
  next(0);
}
// Tên chữ cái, kèm âm của chữ nếu đã có file âm: "B. /b/ /b/"

function beep(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 880] : [220, 180];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? "triangle" : "sawtooth"; o.frequency.value = f;
      const t = actx.currentTime + i * 0.12;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(ok ? 0.25 : 0.08, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.2);
    });
  } catch {}
}

  const en = ["", "Good try!", "Great job!", "Excellent!"][stars];
  $app.innerHTML = `${gameTop(u, "", 0)}
    <div class="finish">
      <div class="bigstars">${[1, 2, 3].map(i => `<span style="${i <= stars ? "" : "opacity:.2;filter:grayscale(1)"}">⭐</span>`).join("")}</div>
      <h2>${en}</h2><p>${msg}${stars > prev && prev > 0 ? " Con vừa phá kỷ lục cũ!" : ""}</p>
      <div class="row"><button class="btn sun" id="again">Chơi lại</button><button class="btn primary" id="next">Chọn trò khác</button></div>
    </div>`;
  bindBack(u);
  document.getElementById("again").onclick = () => go(again);
  document.getElementById("next").onclick = () => go(() => unitPage(u));
  if (stars >= 2) burst();
  speak(en);
}
const grade = (mistakes, a, b) => mistakes <= a ? 3 : mistakes <= b ? 2 : 1;

/* 1. Học từ vựng */
function learn(u) {
  const words = u.words.map(W);
  $app.innerHTML = `${gameTop(u, "Học từ vựng", 0)}
    <div class="learn-tools"><button class="btn primary" id="all">▶ Nghe tất cả</button><button class="btn" id="stop" hidden>■ Dừng</button></div>
    <div class="cards">${words.map((w, i) => `<button class="wcard" data-i="${i}">${pic(w.e)}<span class="en">${esc(w.en)}</span>${S.vi ? `<span class="vi">${esc(w.vi)}</span>` : ""}</button>`).join("")}</div>`;
  bindBack(u);
  const cards = [...$app.querySelectorAll(".wcard")];
  const light = i => { cards.forEach(c => c.classList.remove("lit")); if (cards[i]) { cards[i].classList.add("lit"); cards[i].scrollIntoView({ block: "nearest", behavior: "smooth" }); } };
  let playing = false;

    step(0);

/* 2 + 3. Nghe chọn hình / Nhìn hình chọn từ */
function quiz(u, mode) {
  const pool = u.words.map(W);
  const N = Math.min(8, pool.length);
  const targets = sample(pool, N);
  let i = 0, mistakes = 0;
  function round() {
    const t = targets[i];
    const others = shuffle(pool.filter(w => w.e !== t.e && w.en !== t.en));
    const seen = new Set([t.e]); const opts = [t];
    for (const w of others) { if (opts.length === 4) break; if (!seen.has(w.e)) { seen.add(w.e); opts.push(w); } }
    const list = shuffle(opts);
    const prompt = mode === "listen"
      ? `<h3>Nghe và chọn hình đúng</h3><button class="speaker" id="say" aria-label="Nghe lại">🔊</button>`
      : `<h3>Đây là gì?</h3><div class="big">${pic(t.e)}</div>`;
    $app.innerHTML = `${gameTop(u, "", N, i)}<div class="prompt">${prompt}</div>
      <div class="opts">${list.map((w, j) => mode === "listen"
        ? `<button class="opt" data-j="${j}" aria-label="Lựa chọn ${j + 1}">${pic(w.e)}</button>`
        : `<button class="opt word" data-j="${j}">${esc(w.en)}</button>`).join("")}</div>`;
    bindBack(u);
    if (mode === "listen") { document.getElementById("say").onclick = () => speak(t.en); speak(t.en); }
    let locked = false;
    $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (locked) return;
      const w = list[+b.dataset.j];
      if (w === t) {
        locked = true; b.classList.add("ok"); beep(true);
        $app.querySelectorAll(".opt").forEach(x => x.disabled = true);
        speak(t.en);
        setTimeout(() => { if (!document.body.contains(b)) return; i++; i < N ? round() : finish(u, mode, grade(mistakes, 0, 3), () => quiz(u, mode)); }, 1300);
      } else {
        mistakes++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); b.disabled = true;
        if (mode === "look") speak(w.en);
      }
    });
  }
  round();
}

/* 4. Ghép chữ */
function spell(u) {
  let pool = u.words.map(W).filter(w => /^[a-z]{3,7}$/.test(w.en));
  const N = Math.min(6, pool.length);
  const targets = sample(pool, N);
  let i = 0, mistakes = 0;
  function round() {
    const t = targets[i]; const letters = t.en.split("");
    let tiles = shuffle(letters.map((l, k) => ({ l, k })));
    if (tiles.map(x => x.l).join("") === t.en && letters.length > 2) tiles = [...tiles.slice(1), tiles[0]];
    let pos = 0;
    $app.innerHTML = `${gameTop(u, "", N, i)}
      <div class="prompt"><div class="big">${pic(t.e)}</div>${S.vi ? `<p style="margin:0;color:var(--muted);font-weight:800">${esc(t.vi)}</p>` : ""}
        <div class="slots">${letters.map((_, k) => `<span class="slot ${k === 0 ? "next" : ""}"></span>`).join("")}</div>
        <div class="row" style="margin-top:12px"><button class="speaker small" id="say" aria-label="Nghe từ">🔊</button></div></div>
      <div class="tiles">${tiles.map((x, j) => `<button class="tile" data-j="${j}">${x.l}</button>`).join("")}</div>`;
    bindBack(u);
    document.getElementById("say").onclick = () => speak(t.en);
    speak(t.en);
    const slots = [...$app.querySelectorAll(".slot")];
    $app.querySelectorAll(".tile").forEach(b => b.onclick = () => {
      if (pos >= letters.length) return;
      const x = tiles[+b.dataset.j];
      if (x.l === letters[pos]) {
        slots[pos].textContent = x.l; slots[pos].classList.remove("next"); b.classList.add("used"); pos++;
        if (slots[pos]) slots[pos].classList.add("next");
        if (pos === letters.length) { beep(true); speak(t.en); setTimeout(() => { if (!document.body.contains(b)) return; i++; i < N ? round() : finish(u, "spell", grade(mistakes, 2, 6), () => spell(u)); }, 1300); }
      } else { mistakes++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); }
    });
  }
  round();
}

/* 5. Lật thẻ */
function memory(u) {
  const seen = new Set(); const picks = [];
  for (const w of shuffle(u.words.map(W))) { if (picks.length === 6) break; if (!seen.has(w.e)) { seen.add(w.e); picks.push(w); } }
  pairGame(u, "memory", picks.map(w => ({ a: pic(w.e), b: `<span class="w">${esc(w.en)}</span>`, sayB: w.en, say: w.en })), () => memory(u));
}

/* Lật thẻ dùng chung: mỗi item là một cặp thẻ a/b; say = câu đọc khi ghép đúng */
function pairGame(u, key, items, again) {
  const cards = shuffle(items.flatMap((it, k) => [{ k, t: "a", it }, { k, t: "b", it }]));
  let open = [], done = 0, mistakes = 0, busy = false;
  $app.innerHTML = `${gameTop(u, "Lật thẻ tìm cặp", 0)}<div class="mem">${cards.map((c, j) => `<button class="mcard" data-j="${j}" aria-label="Thẻ ${j + 1}">?</button>`).join("")}</div>`;
  bindBack(u);
  const els = [...$app.querySelectorAll(".mcard")];
  const face = (j, on) => { const c = cards[j], el = els[j]; el.classList.toggle("open", on); el.innerHTML = on ? c.it[c.t] : "?"; };
  els.forEach((el, j) => el.onclick = () => {
    if (busy || el.classList.contains("done") || open.includes(j)) return;
    face(j, true); open.push(j);
    const flipSay = cards[j].t === "a" ? cards[j].it.sayA : cards[j].it.sayB;
    if (flipSay) speak(flipSay);
    if (open.length === 2) {
      const [a, b] = open;
      if (cards[a].k === cards[b].k) {
        els[a].classList.add("done"); els[b].classList.add("done"); open = []; done++; beep(true); speak(cards[a].it.say);
        if (done === items.length) setTimeout(() => document.body.contains(el) && finish(u, key, grade(mistakes, 4, 9), again), 1100);
      } else {
        mistakes++; busy = true;
        setTimeout(() => { face(a, false); face(b, false); open = []; busy = false; }, 1000);
      }
    }
  });
}

/* 7. Xếp câu */
function order(u) {
  const segs = [];
  for (const s of u.sents.map(W)) {
    for (const part of s.en.split(/(?<=[.?!])\s+/)) {
      const n = part.split(" ").length;
      if (n >= 2 && n <= 7 && !segs.some(x => x.en === part)) segs.push({ en: part, e: s.e, vi: s.vi, whole: part === s.en });
    }
  }
  const N = Math.min(5, segs.length);
  const targets = sample(segs, N);
  let i = 0, mistakes = 0;
  function round() {
    const t = targets[i]; const words = t.en.split(" ");
    let bank = shuffle(words.map((w, k) => ({ w, k })));
    if (bank.map(x => x.w).join(" ") === t.en) bank = [...bank.slice(1), bank[0]];
    let ans = [];
    const draw = () => {
      $app.innerHTML = `${gameTop(u, "", N, i)}
        <div class="prompt"><div class="big" style="font-size:90px">${pic(t.e)}</div>${S.vi && t.whole ? `<p style="margin:0 0 10px;color:var(--muted);font-weight:800">${esc(t.vi)}</p>` : ""}<button class="speaker small" id="say" aria-label="Nghe câu">🔊</button></div>
        <div class="answer" id="ans">${ans.map((x, j) => `<button class="wtile in" data-a="${j}">${esc(x.w)}</button>`).join("") || `<span style="color:var(--muted);font-weight:700">Chạm vào các từ bên dưới theo đúng thứ tự</span>`}</div>
        <div class="tiles">${bank.map((x, j) => `<button class="wtile" data-b="${j}">${esc(x.w)}</button>`).join("")}</div>
        <div class="row"><button class="btn primary" id="check" ${bank.length ? "disabled style='opacity:.5'" : ""}>Kiểm tra</button></div>`;
      bindBack(u);
      document.getElementById("say").onclick = () => speak(t.en);
      $app.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { const x = bank.splice(+b.dataset.b, 1)[0]; ans.push(x); speak(x.w); draw(); });
      $app.querySelectorAll("[data-a]").forEach(b => b.onclick = () => { bank.push(ans.splice(+b.dataset.a, 1)[0]); draw(); });
      document.getElementById("check").onclick = () => {
        if (bank.length) return;
        const box = document.getElementById("ans");
        if (ans.map(x => x.w).join(" ") === t.en) {
          box.classList.add("ok"); beep(true);
          $app.querySelectorAll("button.wtile, #check").forEach(x => x.disabled = true);
          speak(t.en, () => setTimeout(() => { if (!document.body.contains(box)) return; i++; i < N ? round() : finish(u, "order", grade(mistakes, 0, 3), () => order(u)); }, 500));
        } else { mistakes++; beep(false); box.classList.remove("bad"); void box.offsetWidth; box.classList.add("bad"); }
      };
    };
    draw(); speak(t.en);
  }
  round();
}

/* Nghe từ / nhìn hình → chọn chữ cái mang âm đó */
function letterQuiz(u, mode) {
  const pool = u.words.map(W);
  const N = Math.min(8, pool.length);
  const targets = sample(pool, N);
  const letters = u.letters.length >= 3 ? u.letters : SG_LETTERS;
  let i = 0, mistakes = 0;
  function round() {
    const t = targets[i], tl = LETTER[t.L];
    // Bỏ chữ cùng âm (c/k) và chữ mà từ cũng chứa (box có cả b lẫn x) để chỉ có một đáp án đúng
    const others = shuffle(letters.filter(l => l.L !== t.L && l.snd !== tl.snd && !hasL(t.en, l)));
    const list = shuffle([tl, ...others.slice(0, u.review ? 3 : 2)]);
    const prompt = mode === "hear"
      ? `<h3>Con nghe thấy âm của chữ nào?</h3><button class="speaker" id="say" aria-label="Nghe lại">🔊</button>`
      : `<h3>Tranh này có âm của chữ nào?</h3><div class="big">${pic(t.e)}</div>`;
    $app.innerHTML = `${gameTop(u, "", N, i)}<div class="prompt">${prompt}<p class="reveal" id="reveal"></p></div>
      <div class="opts" style="grid-template-columns:repeat(${list.length === 3 ? 3 : 2},1fr)">${list.map((l, j) => `<button class="opt letter" data-j="${j}">${UP(l.L)}</button>`).join("")}</div>`;
    bindBack(u);
    if (mode === "hear") { document.getElementById("say").onclick = () => speak(t.en); speak(t.en); }
    let locked = false;
    $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (locked) return;
      if (list[+b.dataset.j] === tl) {
        locked = true; b.classList.add("ok"); beep(true);
        $app.querySelectorAll(".opt").forEach(x => x.disabled = true);
        document.getElementById("reveal").innerHTML = `${mode === "hear" ? pic(t.e) + " " : ""}<b>${esc(t.en)}</b>`;
        speak(t.en);
        setTimeout(() => { if (!document.body.contains(b)) return; i++; i < N ? round() : finish(u, mode, grade(mistakes, 0, 3), () => letterQuiz(u, mode)); }, 1500);
      } else {
        mistakes++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); b.disabled = true;
      }
    });
  }
  round();
}

/* Cho chữ cái → tìm bức tranh có âm của chữ đó */
function find(u) {
  const pool = u.words.map(W);
  const N = Math.min(8, pool.length);
  const targets = sample(pool, N);
  let i = 0, mistakes = 0;
  function round() {
    const t = targets[i], tl = LETTER[t.L];
    const ok = w => w.e !== t.e && !hasL(w.en, tl) && LETTER[w.L].snd !== tl.snd;
    let others = shuffle(pool.filter(ok));
    if (others.length < 3) others = [...others, ...shuffle(SG_LETTERS.flatMap(l => l.words.map(w => W([...w, l.L]))).filter(w => ok(w) && !others.includes(w)))];
    const seen = new Set([t.e]); const opts = [t];
    for (const w of others) { if (opts.length === 4) break; if (!seen.has(w.e)) { seen.add(w.e); opts.push(w); } }
    const list = shuffle(opts);
    $app.innerHTML = `${gameTop(u, "", N, i)}
      <div class="prompt"><h3>Hình nào có âm của chữ này?</h3><div class="bigletter">${tl.L.toUpperCase()}<small>${tl.L}</small></div>
        <p class="reveal">${tl.snd}</p><button class="speaker small" id="say" aria-label="Nghe chữ cái">🔊</button></div>
      <div class="opts">${list.map((w, j) => `<button class="opt" data-j="${j}" aria-label="Lựa chọn ${j + 1}">${pic(w.e)}</button>`).join("")}</div>`;
    bindBack(u);
    document.getElementById("say").onclick = () => speak(sayLetter(tl));
    speak(sayLetter(tl));
    let locked = false;
    $app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (locked) return;
      const w = list[+b.dataset.j];
      if (w === t) {
        locked = true; b.classList.add("ok"); beep(true);
        $app.querySelectorAll(".opt").forEach(x => x.disabled = true);
        speak(`${tl.L.toUpperCase()}. ${t.en}`);
        setTimeout(() => { if (!document.body.contains(b)) return; i++; i < N ? round() : finish(u, "find", grade(mistakes, 0, 3), () => find(u)); }, 1500);
      } else {
        mistakes++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); b.disabled = true; speak(w.en);
      }
    });
  }
  round();
}

/* Ghép chữ hoa với chữ thường; unit ít chữ thì thêm chữ đã học trước đó cho đủ 6 cặp */
function caseMem(u) {
  let picks = sample(u.letters, 6);
  if (picks.length < 6) {
    const start = SG_LETTERS.indexOf(u.letters[0]);
    const learned = shuffle(SG_LETTERS.slice(0, start)), later = shuffle(SG_LETTERS.slice(start + u.letters.length));
    picks = [...picks, ...learned, ...later].slice(0, 6);
  }
  pairGame(u, "case", picks.map(l => ({ a: `<span class="ml">${l.L.toUpperCase()}</span>`, b: `<span class="ml">${l.L}</span>`, sayA: l.L.toUpperCase(), sayB: l.L.toUpperCase(), say: `${l.L.toUpperCase()}. ${l.words[0][0]}` })), () => caseMem(u));
}

/* ---------- Luyện đọc từ mỗi ngày (nhận mặt cả từ, không chỉ chữ cái đầu) ----------
   Mỗi từ có một "hộp" 0–6 (lặp lại ngắt quãng): đúng ngay lần đầu, không nghe gợi ý → lên hộp, lâu hơn mới gặp lại;
   sai → về hộp 0, gặp lại ngay trong buổi và ngày mai.
   Mặt chữ chỉ đi kèm MỘT yếu tố mỗi câu — tranh (nhánh P) hoặc tiếng đọc (nhánh A), không bao giờ cả hai.
   Dạng câu hỏi khó dần theo hộp:          nhánh tranh (P)                    nhánh tiếng (A)
     từ mới  → làm quen:                   chữ + tranh                        chữ + tiếng đọc
     hộp 0–1 →                             đọc từ, chọn hình                   nghe, chọn từ
     hộp 2–3 →                             nhìn hình, chọn từ                  đọc từ, chọn tiếng đọc đúng
     hộp ≥ 4 → nhìn nhanh 1,5 giây rồi:   chọn hình                          chọn tiếng đọc đúng
     xen kẽ mọi mức → điền chữ còn thiếu:  nhìn hình                          nghe đọc
       (thiếu 1 chữ ở hộp 0–1, 2 chữ ở hộp 2–3, 3 chữ ở hộp ≥ 4)
   Phương án nhiễu luôn là từ có mặt chữ giống từ đúng (cùng chữ đầu, chữ cuối, độ dài) để bé phải nhìn cả từ. */
const RD_GAP = [0, 1, 2, 4, 7, 14, 30];   // số ngày tới lần ôn sau, theo hộp
const RD_KNOWN = 4;                       // từ hộp này trở lên coi như đã thuộc
const RD_N = 12, RD_NEW = 5;              // số từ mỗi buổi, số từ mới tối đa
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 6e4) / 864e5);
const rdState = () => store.get("r:words", {});
const rdPool = () => examCtx(EXAM.eow, EXAM.sg).pool.filter(isPic);
function rdStreak() {
  const days = new Set(store.get("r:days", [])), t = today();
  let n = 0, d = days.has(t) ? t : t - 1;
  while (days.has(d)) { n++; d--; }
  return n;
}
// Độ giống mặt chữ giữa hai từ: chữ đầu, chữ cuối, độ dài, số chữ cái chung
function looks(a, b) {
  a = a.toLowerCase(); b = b.toLowerCase();
  const pool = [...b]; let common = 0;
  for (const ch of a) { const i = pool.indexOf(ch); if (i >= 0 && ch !== " ") { common++; pool.splice(i, 1); } }
  return (a[0] === b[0] ? 3 : 0) + (a.at(-1) === b.at(-1) ? 1.5 : 0) + (Math.abs(a.length - b.length) <= 1 ? 1.5 : 0) + 3 * common / Math.max(a.length, b.length);
}
function lookalikes(t, pool, n) {
  const out = [];
  const cand = pool.filter(x => !clash(x, t)).map(x => ({ x, s: looks(t.en, x.en) + Math.random() * 1.2 })).sort((p, q) => q.s - p.s);
  for (const { x } of cand) { if (out.length === n) break; if (!out.some(o => clash(o, x))) out.push(x); }
  return out;
}

function readCta() {
  const st = rdState(), t = today(), pool = rdPool();
  if (store.get("r:days", []).includes(t)) return `Hôm nay con đã luyện rồi 🔥 ${rdStreak()} ngày liên tiếp`;
  const due = pool.filter(x => st[x.en] && st[x.en].due <= t).length;
  return due ? `Hôm nay có ${due} từ cần ôn · 5 phút` : "Nhìn chữ, đọc cả từ · 5 phút mỗi ngày";
}

function readSession() {
  const pool = rdPool(), st = rdState(), t = today();
  const due = shuffle(pool.filter(x => st[x.en] && st[x.en].due <= t)).sort((a, b) => st[a.en].b - st[b.en].b).slice(0, RD_N - 2);
  const fresh = shuffle(pool.filter(x => !st[x.en])).sort((a, b) => b.wt - a.wt).slice(0, Math.min(RD_NEW, RD_N - due.length));
  let list = [...due, ...fresh];
  // Thiếu từ thì lấy thêm từ đang học chưa tới hạn, hộp thấp trước
  if (list.length < RD_N) list.push(...shuffle(pool.filter(x => st[x.en] && !list.includes(x))).sort((a, b) => st[a.en].b - st[b.en].b).slice(0, RD_N - list.length));
  // Mỗi từ trong lượt chỉ đi với MỘT yếu tố: tranh (P) hoặc tiếng đọc (A), chia đều hai nhánh
  const mods = shuffle(list.map((_, i) => i % 2 ? "A" : "P"));
  const lvl = x => !st[x.en] || st[x.en].b < 2 ? 0 : st[x.en].b < RD_KNOWN ? 1 : 2;
  // Khoảng 1/3 số câu là dạng điền chữ còn thiếu, số chữ thiếu tăng theo mức (1–3)
  const steps = shuffle(list.map((x, i) => {
    const m = mods[i], l = lvl(x), miss = Math.random() < RD_MISS && missSlots(x.en, l + 1).length;
    return miss ? { x, m, k: "miss" + m, n: l + 1 } : { x, m, k: RD_K[m][l] };
  }));
  // Từ mới: thẻ làm quen (cùng nhánh) trước, câu hỏi nằm cách đó vài bước
  for (const x of fresh) {
    const i = steps.findIndex(s => s.x === x);
    steps.splice(Math.max(0, i - 2), 0, { x, m: steps[i].m, k: "intro" + steps[i].m });
  }
  return { pool, steps, i: 0, firstOk: 0, asked: 0, again: new Set(), told: new Set() };
}

// Dạng bài theo nhánh và mức (hộp 0–1, 2–3, ≥4)
const RD_K = { P: ["read", "pick", "flashP"], A: ["hear", "match", "flashA"] };
const RD_MISS = .35;                       // tỉ lệ câu điền chữ còn thiếu
// Chọn vị trí các chữ bị che: chỉ che chữ cái, luôn chừa lại ít nhất 2 chữ để bé nhận ra từ
function missSlots(w, n) {
  const pos = [...w].map((c, i) => /[a-z]/i.test(c) ? i : -1).filter(i => i >= 0);
  n = Math.min(n, pos.length - 2);
  if (n < 1) return [];
  return shuffle(pos).slice(0, n).sort((a, b) => a - b);
}
// Chữ cái nhiễu: chữ hay nhầm với chữ đúng, chữ của các từ na ná, rồi nguyên âm
const LOOKS_LIKE = { b: "dph", d: "bpq", p: "qbd", q: "pd", m: "nw", n: "mu", u: "nv", w: "mv", a: "eo", e: "ac", o: "ae", i: "lj", l: "it", h: "nb", c: "eo", g: "qy", y: "gv", s: "z", t: "fl", f: "t", r: "n", k: "h", v: "uw" };
function missTiles(need, x, pool) {
  const out = [...new Set(need)], want = Math.min(6, Math.max(4, out.length + 3));
  const cand = [...need.map(c => LOOKS_LIKE[c] || "").join(""), ...lookalikes(x, pool, 3).map(o => o.en.toLowerCase()).join(""), ..."aeiou", ..."rstnlmbdpc"];
  for (const c of shuffle(cand.filter(c => /[a-z]/.test(c))).sort((a, b) => (need.some(n => (LOOKS_LIKE[n] || "").includes(b)) ? 1 : 0) - (need.some(n => (LOOKS_LIKE[n] || "").includes(a)) ? 1 : 0))) {
    if (out.length >= want) break;
    if (!out.includes(c)) out.push(c);
  }
  return shuffle(out);
}
const RD_SAY = {
  introP: "Từ mới. Con nhìn tranh và nhìn kỹ từng chữ nhé.",
  introA: "Từ mới. Con nghe đọc và chỉ tay theo từng chữ nhé.",
  read: "Con tự đọc từ này, rồi chọn hình đúng.",
  pick: "Hình này là từ nào? Con nhìn kỹ cả từ nhé.",
  flashP: "Từ sẽ hiện thật nhanh. Con đọc rồi chọn hình.",
  hear: "Con nghe, rồi chọn từ đúng.",
  match: "Con đọc từ này. Bấm từng loa để nghe, rồi chọn tiếng đọc đúng.",
  flashA: "Từ sẽ hiện thật nhanh. Con đọc rồi chọn tiếng đọc đúng.",
  missP: "Từ bị thiếu chữ. Con nhìn hình, rồi chọn chữ còn thiếu.",
  missA: "Từ bị thiếu chữ. Con nghe, rồi chọn chữ còn thiếu.",
};
function readRun(R) {
  const back = () => go(readHome);
  if (R.i >= R.steps.length) return readDone(R);
  const { x, m, k, retry, n } = R.steps[R.i];
  const top = `<div class="game-top"><button class="btn back" id="back" aria-label="Quay lại">←</button><div class="dots">${R.steps.map((_, j) => `<i class="${j < R.i ? "done" : j === R.i ? "now" : ""}"></i>`).join("")}</div></div>`;
  const next = () => { R.i++; go(() => readRun(R)); };
  // Lần đầu gặp mỗi dạng trong lượt: đọc hướng dẫn bằng tiếng Việt (onend: đọc xong thì làm tiếp)
  const told = R.told.has(k);
  const intro = then => { if (!told) { R.told.add(k); speakSeq([{ en: false, t: RD_SAY[k] }]); if (then) setTimeout(then, 3800); } else if (then) then(); };
  const word = `<span class="rword">${esc(x.en)}</span>`;
  const letters = `<div class="rletters">${[...x.en].map(c => c === " " ? `<i class="sp"></i>` : `<span>${esc(c)}</span>`).join("")}</div>`;
  // Chữ sáng lần lượt từ trái sang phải khi máy đọc, để bé chỉ tay theo
  const lit = () => {
    $app.querySelectorAll(".rletters span").forEach((s, j) => { s.classList.remove("lit"); setTimeout(() => s.classList.add("lit"), 120 * j); });
    speak(x.en);
  };
  const alive = id => () => document.getElementById(id);

  if (k === "introP" || k === "introA") {
    $app.innerHTML = `${top}<div class="prompt"><h3>🌱 Từ mới</h3>${k === "introP" ? `<div class="big">${pic(x.e)}</div>` : ""}${letters}
      <div class="row">${k === "introA" ? `<button class="btn" id="say">🔊 Nghe lại</button>` : ""}<button class="btn primary" id="ok">Con nhớ rồi →</button></div></div>`;
    document.getElementById("back").onclick = back;
    document.getElementById("ok").onclick = next;
    if (k === "introA") { document.getElementById("say").onclick = lit; intro(() => alive("say")() && lit()); }
    else intro();
    return;
  }

  // Cập nhật hộp của từ (lượt làm lại trong buổi không tính lên hộp)
  const record = (wrong, helped) => {
    if (retry) return;
    R.asked++;
    const st = rdState(), s = st[x.en] || { b: 0, bad: 0 };
    if (!wrong && !helped) { R.firstOk++; s.b = Math.min(s.b + 1, RD_GAP.length - 1); }
    else if (wrong) { s.b = 0; s.bad = (s.bad || 0) + 1; }
    s.due = today() + (wrong || helped ? 1 : RD_GAP[s.b]);
    st[x.en] = s; store.set("r:words", st);
    if (wrong) { R.again.add(x.en); R.steps.push({ x, m, k: RD_K[m][0], retry: true }); }
  };
  const optPool = R.pool.length > 8 ? R.pool : examCtx(EXAM.eow, EXAM.sg).all.filter(isPic);

  // Điền chữ còn thiếu: nhánh tranh chỉ có hình, nhánh tiếng chỉ có tiếng đọc
  if (k === "missP" || k === "missA") {
    const gaps = missSlots(x.en, n || 1), need = gaps.map(i => x.en[i].toLowerCase());
    const tiles = missTiles(need, x, optPool);
    let at = 0, wrong = 0, locked = false;
    const slots = [...x.en].map((c, i) => c === " " ? `<i class="sp"></i>` : gaps.includes(i) ? `<span class="gap" data-g="${i}"></span>` : `<span>${esc(c)}</span>`).join("");
    $app.innerHTML = `${top}<div class="prompt"><h3>Chọn ${gaps.length > 1 ? `${gaps.length} chữ còn thiếu, lần lượt từ trái sang phải` : "chữ còn thiếu"}</h3>
      ${k === "missP" ? `<div class="big">${pic(x.e)}</div>` : `<button class="speaker" id="say" aria-label="Nghe lại">🔊</button>`}
      <div class="rletters miss">${slots}</div></div>
      <div class="ltiles">${tiles.map(c => `<button class="opt ltile" data-c="${c}">${c}</button>`).join("")}</div>`;
    document.getElementById("back").onclick = back;
    const mark = () => $app.querySelectorAll(".rletters .gap").forEach((g, j) => g.classList.toggle("now", j === at));
    mark();
    if (k === "missA") { document.getElementById("say").onclick = () => speak(x.en); intro(() => alive("say")() && !locked && speak(x.en)); }
    else intro();
    $app.querySelectorAll(".ltile").forEach(b => b.onclick = () => {
      if (locked) return;
      if (b.dataset.c !== need[at]) { wrong++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); return; }
      const g = $app.querySelector(`.gap[data-g="${gaps[at]}"]`);
      g.textContent = x.en[gaps[at]]; g.classList.add("fill");
      at++; mark();
      if (at < need.length) return;
      locked = true; beep(true);
      $app.querySelectorAll(".ltile").forEach(o => o.disabled = true);
      $app.querySelector(".rletters").classList.add("done");
      if (m === "A") speak(x.en);
      record(wrong, false);
      setTimeout(() => { if (document.body.contains(b)) next(); }, wrong ? 2000 : 1500);
    });
    return;
  }

  const others = lookalikes(x, optPool, 2);
  const list = shuffle([x, ...others]);
  let wrong = 0, helped = false, locked = false, prompt, opts;
  const flash = k === "flashP" || k === "flashA";
  const wordBox = `<div class="rbox" id="wbox">${word}</div>${flash ? `<div class="row" style="margin-top:6px"><button class="btn" id="peek" hidden>👀 Xem lại</button></div>` : ""}`;
  if (k === "pick") {
    prompt = `<h3>Hình này là từ nào?</h3><div class="big">${pic(x.e)}</div>`;
    opts = `<div class="opts o1">${list.map((w, j) => `<button class="opt word rw" data-j="${j}">${esc(w.en)}</button>`).join("")}</div>`;
  } else if (k === "hear") {
    prompt = `<h3>Nghe và chọn từ đúng</h3><button class="speaker" id="say" aria-label="Nghe lại">🔊</button>`;
    opts = `<div class="opts o1">${list.map((w, j) => `<button class="opt word rw" data-j="${j}">${esc(w.en)}</button>`).join("")}</div>`;
  } else if (k === "match" || k === "flashA") {
    prompt = `<h3>${flash ? "⚡ Nhìn nhanh, rồi chọn tiếng đọc đúng" : "Đọc từ, rồi chọn tiếng đọc đúng"}</h3>${wordBox}`;
    opts = `<div class="aopts">${list.map((w, j) => `<div class="aopt"><button class="play" data-p="${j}" aria-label="Nghe tiếng đọc ${j + 1}">🔊<small>${j + 1}</small></button><button class="opt pickb" data-j="${j}">Chọn ${j + 1}</button></div>`).join("")}</div>`;
  } else {
    prompt = `<h3>${flash ? "⚡ Nhìn nhanh rồi chọn hình" : "Con đọc từ này, rồi chọn hình đúng"}</h3>${wordBox}`;
    opts = `<div class="opts o3">${list.map((w, j) => `<button class="opt" data-j="${j}" aria-label="Hình ${j + 1}">${pic(w.e)}</button>`).join("")}</div>`;
  }
  $app.innerHTML = `${top}<div class="prompt">${prompt}</div>${opts}`;
  document.getElementById("back").onclick = back;
  if (k === "hear") { document.getElementById("say").onclick = () => speak(x.en); intro(() => alive("say")() && !locked && speak(x.en)); }
  else intro();
  $app.querySelectorAll(".play[data-p]").forEach(b => b.onclick = () => {
    $app.querySelectorAll(".play").forEach(p => p.classList.toggle("on", p === b));
    speak(list[+b.dataset.p].en);
  });
  if (flash) {
    const box = document.getElementById("wbox"), peek = document.getElementById("peek");
    let tm;
    const show = () => { box.classList.remove("gone"); clearTimeout(tm); tm = setTimeout(() => { if (locked) return; box.classList.add("gone"); peek.hidden = false; }, (S.slow ? 2000 : 1500) + (told ? 0 : 2500)); };
    peek.onclick = () => { helped = true; peek.hidden = true; show(); };
    show();
  }
  $app.querySelectorAll(".opt[data-j]").forEach(b => b.onclick = () => {
    if (locked) return;
    const w = list[+b.dataset.j];
    if (w !== x) { wrong++; beep(false); b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad"); b.disabled = true; return; }
    locked = true; beep(true); b.classList.add("ok");
    $app.querySelectorAll(".opt").forEach(o => o.disabled = true);
    const wb = document.getElementById("wbox"); if (wb) wb.classList.remove("gone");
    // Phản hồi giữ đúng nhánh: nhánh tranh hiện chữ dưới tranh (không đọc), nhánh tiếng đọc lại từ (không tranh)
    if (m === "P" && k !== "pick") b.insertAdjacentHTML("beforeend", `<span class="wlab">${esc(x.en)}</span>`);
    if (m === "A") speak(x.en);
    record(wrong, helped);
    setTimeout(() => { if (document.body.contains(b)) next(); }, wrong ? 2000 : 1400);
  });
}

function readDone(R) {
  const t = today(), days = store.get("r:days", []);
  if (!days.includes(t)) store.set("r:days", [t, ...days].slice(0, 400));
  const stars = R.asked ? (R.firstOk >= R.asked * .9 ? 3 : R.firstOk >= R.asked * .6 ? 2 : 1) : 3;
  const en = ["", "Good try!", "Great job!", "Excellent!"][stars];
  const again = R.pool.filter(x => R.again.has(x.en));
  $app.innerHTML = `<div class="game-top"><button class="btn back" id="back" aria-label="Quay lại">←</button></div>
    <div class="finish">
      <div class="bigstars">${[1, 2, 3].map(i => `<span style="${i <= stars ? "" : "opacity:.2;filter:grayscale(1)"}">⭐</span>`).join("")}</div>
      <h2>${en}</h2>
      <p>Con đọc đúng ngay ${R.firstOk}/${R.asked} từ. 🔥 Đã luyện ${rdStreak()} ngày liên tiếp!</p>
      ${again.length ? `<div class="section-label" style="margin-top:16px">Ngày mai ôn lại — chạm để nghe</div><div class="chips" style="justify-content:center">${again.map(x => `<button class="chip rchip" data-say="${esc(x.en)}">🔊 ${esc(x.en)}</button>`).join("")}</div>` : ""}
      <div class="row"><button class="btn sun" id="more">Luyện thêm</button><button class="btn primary" id="fin">Xong</button></div>
    </div>`;

/* ---------- Bài kiểm tra tổng hợp (theo khung đề Practice Test lớp 1 ở trường) ----------
   Phonetics, Vocabulary, Writing: từ vựng của cả 2 sách. Grammar, Reading: mẫu câu Explore Our World + từ vựng cả 2 sách.
   Kiến thức lấy từ đầu tới bài bé đang học; bài càng gần càng được ưu tiên (trọng số REC theo khoảng cách). */
const NUMW = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
const cap = s => s[0].toUpperCase() + s.slice(1);
const rnd = n => Math.floor(Math.random() * n);
const one = a => a[rnd(a.length)];
const REC = d => d <= 0 ? 5 : d === 1 ? 2.5 : d === 2 ? 1.5 : 1;
function wpick(arr, wf) {
  const ws = arr.map(x => Math.max(0, wf(x))), tot = ws.reduce((a, b) => a + b, 0);
  if (!tot) return one(arr);
  let r = Math.random() * tot;
  for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r < 0) return arr[i]; }
  return arr[arr.length - 1];
}
const EW = Object.fromEntries(UNITS.flatMap(u => u.words.map(w => [w[0], w[2]])));
const SGL = Object.fromEntries(SG_LETTERS.flatMap(l => l.words.map(w => [w[0], l.L])));
// Từ khó vẽ thành tranh rõ nghĩa (tính từ, động từ, từ trừu tượng) — không dùng làm câu hỏi tranh
const NOPIC = new Set(["good", "in", "look", "kick", "fat", "umpire", "October", "elbow", "hello", "goodbye", "big", "small", "tall", "short", "old", "young", "parents", "jump", "feet", "up", "under", "quiet", "ill", "question", "eating"]);
const NOTNOUN = new Set(["angry", "cut", "fat", "good", "happy", "in", "kick", "look", "sad", "sit", "wash", "yawn", "fix", "October", "hello", "goodbye", "big", "small", "tall", "short", "old", "young", "cleaning", "cooking", "eating", "sleeping", "taking a bath", "watching TV", "jump", "run", "walk", "up", "under", "quiet", "ill", "zigzag", "long hair", "strong arms"]);
const PLURAL_ONLY = new Set(["gloves", "pants", "shoes", "socks", "parents", "feet"]);
const MASS = new Set(["rice", "soup", "milk", "tea", "water", "lemonade", "orange juice", "juice", "chicken", "hair", "paper", "yarn", "jam"]);
const PEOPLE = new Set(["baby", "girl", "man", "nurse", "umpire", "mother", "father", "sister", "brother", "grandmother", "grandfather", "king", "queen", "elf"]);
const NOPLURAL = new Set(["sky", "sun", "moon", "sea", "zoo", "river", "fish", "jellyfish", "bathroom", "bedroom", "dining room", "kitchen", "living room"]);
// Nhóm từ có tranh na ná nhau: không để chung một câu hỏi kẻo có hai đáp án đúng
const CONFUSE = [["bush", "leaf", "tree"], ["lemon", "lemonade"], ["juice", "orange juice"], ["clock", "watch"], ["hen", "bird", "chicken"], ["bear", "panda", "koala", "teddy bear"], ["doll", "teddy bear"], ["dog", "wolf", "fox"], ["gorilla", "monkey"], ["iguana", "alligator"], ["goat", "yak", "ox"], ["horse", "zebra"], ["sky", "cloud"], ["living room", "sofa"], ["bedroom", "sleeping"], ["bathroom", "taking a bath"], ["kitchen", "cooking"], ["dress", "skirt"], ["jacket", "vest", "shirt"], ["hair", "long hair"], ["car", "van", "truck", "bus", "jeep"], ["insect", "worm", "ant"], ["cookie", "cake"], ["sea", "water"], ["happy", "good"], ["sad", "angry", "ill"], ["bird", "ostrich"], ["leg", "kick", "foot"], ["hand", "gloves"]];
const GRP = {}; CONFUSE.forEach((g, i) => g.forEach(w => (GRP[w] = GRP[w] || []).push(i)));
const clash = (a, b) => a.en === b.en || a.e === b.e || (GRP[a.en] || []).some(i => (GRP[b.en] || []).includes(i));
const kind = x => x.e.startsWith("color:") ? "color" : x.e.startsWith("num:") ? "num" : NOTNOUN.has(x.en) ? "other" : PLURAL_ONLY.has(x.en) ? "pl" : MASS.has(x.en) ? "mass" : "noun";
const an = w => (/^[aeiou]/.test(w) ? "an " : "a ") + w;
const wrongAn = w => (/^[aeiou]/.test(w) ? "a " : "an ") + w;
const IRR = { mouse: "mice", foot: "feet", leaf: "leaves", shelf: "shelves", wolf: "wolves", tomato: "tomatoes", volcano: "volcanoes" };
function plural(w) {
  const p = w.split(" "), l = p.pop();
  return [...p, IRR[l] || (/(s|x|z|ch|sh)$/.test(l) ? l + "es" : /[^aeiou]y$/.test(l) ? l.slice(0, -1) + "ies" : l + "s")].join(" ");
}

const isImg = x => isPic(x) && !/^(color|num):/.test(x.e);

const isFam = x => typeof FAM[x.en] === "string";

const ACT4 = ["cleaning", "cooking", "sleeping", "taking a bath", "watching TV"];

const P = {
  one: x => pic(x.e),
  many: (e, n) => `<span class="cnt">${Array(n).fill(pic(e)).join("")}</span>`,
  badge: (e, b) => `<span class="bdg">${pic(e)}<i>${b}</i></span>`,
  scene: (place, thing) => `<span class="scene">${pic(place)}<span class="t">${pic(thing)}</span></span>`,
};

function examCtx(eow, sg) {
  const pool = new Map(), all = new Map();
  const add = (m, w, wt) => { const c = m.get(w[0]); if (!c || c.wt < wt) m.set(w[0], { en: w[0], vi: w[1], e: w[2], wt }); };
  UNITS.forEach((u, i) => u.words.forEach(w => { add(all, w, 0.3); if (i <= eow) add(pool, w, REC(eow - i)); }));
  SG_UNITS.forEach((u, i) => u.letters.forEach(l => l.words.forEach(w => { add(all, w, 0.3); if (i < sg) add(pool, w, REC(sg - 1 - i)); })));
  const used = new Map();
  const c = { eow, sg, pool: [...pool.values()], all: [...all.values()], usedT: new Map(), usedL: new Map() };
  // Lấy 1 từ theo trọng số bài gần; từ đã ra trong đề bị giảm mạnh để đề ít lặp. Hết từ phù hợp thì mượn từ ngoài phạm vi.
  c.pick = (f, avoid = []) => {
    const ok = x => f(x) && !avoid.some(a => clash(a, x));
    let cand = c.pool.filter(ok);
    if (!cand.length) cand = c.all.filter(ok);
    const x = wpick(cand, x => x.wt * 0.15 ** (used.get(x.en) || 0));
    used.set(x.en, (used.get(x.en) || 0) + 1);
    return x;
  };
  c.pickN = (n, f, avoid) => { const out = []; for (let i = 0; i < n; i++) out.push(c.pick(f, [...avoid, ...out])); return out; };
  return c;
}
function pickT(c, list) {
  const ts = list.filter(t => t.u <= c.eow), per = {};
  ts.forEach(t => per[t.u] = (per[t.u] || 0) + 1);
  const t = wpick(ts, t => REC(c.eow - t.u) / per[t.u] * 0.3 ** (c.usedT.get(t) || 0));
  c.usedT.set(t, (c.usedT.get(t) || 0) + 1);
  return t;
}

const LOC = { tree: ["in the tree", "trên cây"], rock: ["on the rock", "trên hòn đá"], river: ["in the river", "dưới sông"], sky: ["in the sky", "trên bầu trời"],
  flower: ["on the flower", "trên bông hoa"], bush: ["on the bush", "trên bụi cây"], desk: ["on the desk", "trên bàn"], chair: ["on the chair", "trên ghế"], wall: ["on the wall", "trên tường"] };

/* Từ các sự thật trong tranh sinh câu đúng / sai.
   fact = { o: vật, n: số lượng (0 = không có), at: chỗ, alt: các chỗ khác có thể nói sai, cnt: có đếm được không } */
function sceneStatements(facts, eow) {
  const out = [], there = eow >= 4;
  const name = (o, n) => n === 1 ? `the ${o}` : `the ${plw(o)}`;
  for (const f of facts) {
    const vo = SCN_VI[f.o];
    if (f.n > 0) {
      const [L, Lv] = LOC[f.at], be = f.n === 1 ? "is" : "are";
      // Vị trí: đúng ở chỗ thật, sai ở chỗ khác
      out.push({ k: f.o, yes: true, s: `${cap(name(f.o, f.n))} ${be} ${L}.`, vi: `${cap(vo)} ở ${Lv}.`, see: `Trong tranh, ${vo} ở ${Lv}.` });
      for (const a of f.alt || []) out.push({ k: f.o, yes: false, s: `${cap(name(f.o, f.n))} ${be} ${LOC[a][0]}.`, vi: `${cap(vo)} ở ${LOC[a][1]}.`, see: `Trong tranh, ${vo} ở ${Lv}, không phải ${LOC[a][1]}.` });
      // Số lượng (Unit 4: There is / There are)
      if (there && f.cnt) {
        const sayN = n => n === 1 ? `There is ${an(f.o)} ${L}.` : `There are ${NUMW[n]} ${plw(f.o)} ${L}.`;
        out.push({ k: f.o + "#", yes: true, s: sayN(f.n), vi: `Có ${f.n} ${vo} ${Lv}.`, see: `Con đếm ${vo} ${Lv}: có ${f.n}.` });
        const m = f.n + (f.n > 1 && Math.random() < .5 ? -1 : 1);
        out.push({ k: f.o + "#", yes: false, s: sayN(m), vi: `Có ${m} ${vo} ${Lv}.`, see: `Con đếm ${vo} ${Lv}: chỉ có ${f.n} thôi.` });
      }
    } else if (f.at) {
      // Vật không có trong tranh
      const [L, Lv] = LOC[f.at];
      out.push({ k: f.o, yes: false, s: there ? `There is ${an(f.o)} ${L}.` : `The ${f.o} is ${L}.`, vi: there ? `Có ${vo} ${Lv}.` : `${cap(vo)} ở ${Lv}.`, see: `Trong tranh không có ${vo}.` });
    }
  }
  return out;
}

  if (ok("duck")) {
    const duckAt = rockBy === "duck" ? "rock" : one(["river", null]);
    if (duckAt === "rock") parts.push(put("duck", 338, 204, .75));
    if (duckAt === "river") parts.push(put("duck", 46, 212, .7));
    facts.push(duckAt ? { o: "duck", n: 1, at: duckAt, alt: [duckAt === "rock" ? "river" : "rock"] } : { o: "duck", n: 0, at: rockBy || birdAt === "rock" ? "river" : "rock" });

}

function classroomScene(ok) {
  const parts = [], facts = [];

  wall.slice(0, 2).forEach((o, i) => parts.push(put(o, ...wallPos[i], o === "clock" ? 1.1 : 1)));
  facts.push(...wall.slice(0, 2).map(o => ({ o, n: 1, at: "wall", alt: ["desk"] })), { o: wall[2], n: 0, at: "wall" });
  // Bàn: máy tính (có thể) + 2 loại đồ; ghế: 1 đồ hoặc để trống. Mỗi loại đồ chỉ ở một chỗ.
  const things = shuffle(["book", "pencil", "crayon", "eraser", "paper", "pen"].filter(ok));

  const onDesk = things.slice(0, pc ? 2 : 3), onChair = Math.random() < .75 ? things[pc ? 2 : 3] : null;

    const multi = ["pencil", "crayon", "pen"].includes(o), n = multi ? 1 + rnd(3) : 1;
    for (let k = 0; k < n; k++) parts.push(put(o, x - (n - 1) * 7 + k * 14, y + (k % 2) * 3, .8, false, multi ? -62 : 0));
    facts.push({ o, n, at: "desk", alt: ["chair"], cnt: multi });
  });
  if (onChair) { parts.push(put(onChair, 334, 178, .8)); facts.push({ o: onChair, n: 1, at: "chair", alt: ["desk"] }); }
  const absent = things.filter(o => !onDesk.includes(o) && o !== onChair);
  if (absent.length) facts.push({ o: absent[0], n: 0, at: one(["desk", "chair"]) });
  const bg = `<path ${OPEN} d="M0,196 L400,196"/><path ${OPEN} d="M0,206 L400,206"/>

  return { svg: sceneSvg(bg, parts, "Tranh lớp học"), facts };
}

const SCENES = [{ u: 1, make: classroomScene }, { u: 2, make: natureScene }];
// Bài Reading với tranh lớn: ví dụ (đúng) + 5 câu, chọn mỗi câu về một vật khác nhau nếu được. Chưa học tới chủ đề nào thì trả về null.
function sceneReading(c) {
  const ths = SCENES.filter(t => t.u <= c.eow);
  if (!ths.length) return null;
  const inScope = new Set(c.pool.map(x => x.en));
  const th = wpick(ths, t => REC(c.eow - t.u));
  const { svg, facts } = th.make(w => inScope.has(w));
  const cand = shuffle(sceneStatements(facts.filter(f => inScope.has(f.o)), c.eow));
  const want = [true, ...shuffle([true, true, false, false, Math.random() < .5])], used = new Set(), out = [];
  for (const y of want) {
    const s = cand.find(x => x.yes === y && !used.has(x.k) && !out.includes(x)) || cand.find(x => x.yes === y && !out.includes(x));
    if (!s) return null;
    used.add(s.k); out.push(s);
  }
  return { svg, items: out.map(s => ({ q: s.s, opts: ["Yes", "No"], ans: s.yes ? 0 : 1, hints: [
    { t: "Con nghe câu này, rồi tìm trong tranh nhé.", say: s.s },
    { t: `Câu nghĩa là: <b lang="vi">${esc(s.vi)}</b>` },
    { t: esc(s.see) },
  ] })) };
}

const K = "ABCDEFGH";

function makeExam(eow, sg) {
  const c = examCtx(eow, sg);
  const qHint = r => ({ t: `Câu hỏi nghĩa là: <b lang="vi">${esc(r.vi)}</b>`, say: r.q });
  const gram = () => {
    const r = pickT(c, G).f(c), bad = sample([...new Set(r.bad)].filter(b => b !== r.ok), 2);
    if (bad.length < 2) return null;
    const o = shuffle([r.ok, ...bad]), it = { pic: r.pic, q: r.q, opts: o, ans: o.indexOf(r.ok), sig: r.q + r.ok };
    it.hints = [qHint(r), { t: r.tip }, cutHint(it)];
    return it;
  };
  const pho = many(7, () => genPho(c));
  const vocA = many(7, i => genVocA(c, i === 3 || i === 6));
  // Bài 3: khung 8 từ (A là ví dụ), 7 tranh, thừa 1 từ; viết chữ cái của từ đúng vào ô dưới tranh
  // Tối đa 2 từ chỉ màu để tranh đa dạng
  const bk = [];
  for (let i = 0; i < 8; i++) bk.push(c.pick(x => isPic(x) && !x.e.startsWith("num:") && (!isColor(x) || bk.filter(isColor).length < 2), bk));
  const bAns = [label(bk[0]), ...shuffle(bk.slice(1).map(label))];
  const vocB = bk.slice(0, 7).map(x => {
    const it = { pic: P.one(x), opts: bAns.map((_, j) => K[j]), ans: bAns.indexOf(label(x)) };
    const cut = wrongOf(it).slice(1);
    it.hints = [
      { t: `Tranh là: <b lang="vi">${esc(x.vi)}</b>.` },
      { t: `Từ tiếng Anh bắt đầu bằng chữ <b>${x.en[0].toUpperCase()}</b>.` },
      { t: `Con chỉ còn chọn giữa <b>${it.opts.filter((_, j) => !cut.includes(j)).join("</b> và <b>")}</b> thôi.`, cut },
    ];
    return it;
  });
  const gra = many(8, gram);
  // Điền chỗ trống: ví dụ + 5 câu, 3 phương án
  const gap = many(6, () => {
    const r = pickT(c, GF).f(c), o = shuffle([r.ok, ...r.bad]);
    const it = { q: r.s, opts: o, ans: o.indexOf(r.ok), sig: r.s + r.ok };
    it.hints = [{ t: `Câu nghĩa là: <b lang="vi">${esc(r.vi)}</b>` }, { t: r.tip }, cutHint(it)];
    return it;
  });
  const yes = [true, ...shuffle([true, true, false, false, Math.random() < .5])];
  const rea = many(6, i => {
    const r = pickT(c, R).f(c, yes[i]);
    return { pic: r.pic, q: r.s, opts: ["Yes", "No"], ans: yes[i] ? 0 : 1, sig: r.s, hints: [
      { t: "Con nghe câu này, rồi nhìn kỹ tranh nhé.", say: r.s },
      { t: `Câu nghĩa là: <b lang="vi">${esc(r.vi)}</b>` },
      { t: `${esc(r.see)} Có giống câu không?` },
    ] };
  });
  // Reading: tranh lớn chung cho cả bài nếu đã học tới chủ đề có tranh, không thì mỗi câu một tranh nhỏ
  const big = sceneReading(c);
  const wri = many(6, () => genWrite(c));
  const parts = [
    { sec: "pho", head: "I. Phonetics", no: 1, en: "Look at the pictures and sounds. CIRCLE the correct answers.", vi: "Đọc âm, khoanh vào tranh có âm đó ở đầu từ.", lay: "pics", items: pho },
    { sec: "voc", head: "II. Vocabulary", no: 2, en: "Look at the pictures. CIRCLE the correct answers.", vi: "Nhìn tranh, khoanh vào từ đúng.", lay: "words", items: vocA },
    { sec: "voc", no: 3, en: "Look, read, and WRITE letters in the boxes. There is an extra answer.", vi: "Nhìn tranh, đọc từ trong khung, viết chữ cái của từ đúng vào ô dưới tranh. Có một từ thừa.", lay: "bank", items: vocB, answers: bAns },
    { sec: "gra", head: "III. Grammar", no: 4, en: "Look and read. CIRCLE the correct answers.", vi: "Nhìn tranh, đọc câu hỏi, khoanh câu trả lời đúng.", lay: "qa", items: gra },
    { sec: "gra", no: 5, en: "Read and CIRCLE the correct answers.", vi: "Đọc câu, chọn từ đúng điền vào chỗ trống.", lay: "gap", items: gap },
    { sec: "rea", head: "IV. Reading", no: 6, en: "Look and read. CIRCLE the correct answer.", vi: "Nhìn tranh, đọc câu. Câu đúng với tranh chọn Yes, sai chọn No.", lay: "yn", items: big ? big.items : rea, scene: big && big.svg },
    { sec: "wri", head: "V. Writing", no: 7, en: "Look. CIRCLE the correct answer. WRITE.", vi: "Nhìn tranh, chọn chữ cái còn thiếu trong từ.", lay: "write", items: wri, pts: 2 },
  ];
  let id = 0, n = 0;
  for (const p of parts) p.items.forEach((it, j) => {
    Object.assign(it, { id: id++, ex: j === 0, sec: p.sec, pts: p.pts || 1 });
    it.sel = it.ex ? it.ans : null;
    if (!it.ex) it.n = ++n;
  });
  return { eow, sg, parts, done: false, hints: EXAM.hints };
}

function bindScope(onChange) {
