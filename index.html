function examPage(T) {
  document.title = "Practice Test · Lớp 1";
  const items = T.parts.flatMap(p => p.items), real = items.filter(i => !i.ex);
  const byId = Object.fromEntries(items.map(i => [i.id, i]));
  const score = list => list.filter(i => !i.ex).reduce((a, i) => a + (T.done && i.sel === i.ans ? i.pts : 0), 0);
  const maxOf = list => list.filter(i => !i.ex).reduce((a, i) => a + i.pts, 0);
  const bySec = k => real.filter(i => i.sec === k);
  const total = score(real), max = maxOf(real);
  const stars = total >= max * .9 ? 3 : total >= max * .7 ? 2 : 1;
  const wrong = real.filter(i => i.sel !== i.ans).length;
  const letters = SG_UNITS.slice(0, T.sg).flatMap(u => u.letters);
  const partOf = Object.fromEntries(T.parts.flatMap(p => p.items.map(i => [i.id, p])));
  const usedHints = real.reduce((a, i) => a + (i.hl || 0), 0);
  // Các đáp án đã bị gạch bởi gợi ý mức đã mở
  const cutOf = it => (it.hints || []).slice(0, it.hl || 0).flatMap(h => h.cut || []);
  const hintsHtml = it => {
    const hl = it.hl || 0;
    return !it.ex && hl ? `<div class="hints noprint">${it.hints.slice(0, hl).map((h, k) => `<p><span><i>Gợi ý ${k + 1}</i>${h.t}</span><button class="say" data-hs="${it.id}:${k}" aria-label="Đọc gợi ý ${k + 1}">🔊</button></p>`).join("")}</div>` : "";
  };
  // Nút gợi ý (hoặc số gợi ý đã dùng khi đã nộp) + nhãn Ví dụ / dấu chấm đúng sai
  const markHtml = it => {
    const hl = it.hl || 0;
    const hb = it.ex || !it.hints || !T.hints ? "" : T.done ? (hl ? `<span class="hu" title="Số gợi ý đã dùng">💡${hl}</span>` : "")
      : `<button class="hintb noprint" data-h="${it.id}"${hl >= 3 ? " disabled" : ""} aria-label="Gợi ý (đã dùng ${hl}/3)">💡<span class="ht"> Gợi ý</span> <i>${hl}/3</i></button>`;
    return hb + (it.ex ? `<span class="exb">Ví dụ</span>` : T.done ? (it.sel === it.ans ? `<span class="mk ok" aria-label="Đúng">✓</span>` : `<span class="mk no" aria-label="Sai">✗</span>`) : "");
  };

  // Ô đang chọn dở của bài khung từ: q = câu (tranh), a = từ trong khung, pi = bài
  const MS = { q: null, a: null, pi: null };
  /* Bài khung từ (Vocabulary 3): chạm tranh rồi chạm từ trong khung (hoặc ngược lại) để điền chữ cái vào ô.
     Dùng chung MS và cách xử lý chạm với bài nối (data-mq = câu, data-ma = đáp án). Gợi ý của câu đang chọn hiện dưới các tranh. */
  const bankHtml = (p, pi) => {
    const act = MS.q != null && partOf[MS.q] === p ? byId[MS.q] : null, cut = act ? cutOf(act) : [];
    const used = new Map(p.items.filter(i => i.sel != null).map(i => [i.sel, i]));
    const bank = p.answers.map((a, j) => {
      const u = used.get(j), x = !T.done && cut.includes(j), on = MS.pi === pi && MS.a === j;
      return `<button class="wb${on ? " on" : ""}${u ? (u.ex ? " ex" : " used") : ""}${x ? " cut" : ""}" data-ma="${j}" aria-pressed="${on}"${T.done || (u && u.ex) || x ? " disabled" : ""}><b>${K[j]}</b> – ${esc(a)}</button>`;
    }).join("");
    const tiles = p.items.map(it => {
      const res = T.done && !it.ex ? (it.sel === it.ans ? " right" : " wrong") : "";
      return `<div class="bq${it.ex ? " ex" : ""}${act === it ? " on" : ""}${res}" data-mq="${it.id}"${it.ex || T.done ? "" : ` role="button" tabindex="0" aria-pressed="${act === it}" aria-label="Câu ${it.n}"`}>
        <span class="qp">${it.pic}</span>
        <span class="brow"><span class="qn">${it.ex ? 0 : it.n}.</span><span class="bbox">${it.sel != null ? K[it.sel] : ""}</span>${res === " wrong" ? `<span class="bfix" title="Đáp án đúng">${K[it.ans]}</span>` : ""}</span>
        ${it.ex ? "" : markHtml(it)}</div>`;
    }).join("");
    const hint = act && act.hl ? `<div class="bhint noprint"><p class="xmeta">Gợi ý câu ${act.n}</p>${hintsHtml(act)}</div>` : "";
    return `<div class="bankp" data-mg="${pi}"><div class="wbank">${bank}</div><div class="bgrid">${tiles}</div>${hint}</div>`;
  };
  const paintBank = pi => {
    const g = $app.querySelector(`[data-mg="${pi}"]`), f = document.activeElement, p = T.parts[pi];
    const fk = f && g.contains(f) ? (f.dataset.mq != null ? `[data-mq="${f.dataset.mq}"]` : f.dataset.ma != null ? `[data-ma="${f.dataset.ma}"]` : null) : null;
    g.outerHTML = bankHtml(p, pi);
    const ng = $app.querySelector(`[data-mg="${pi}"]`);
    if (fk) { const el = ng.querySelector(fk); if (el && !el.disabled) el.focus(); }
  };

  const qHtml = (p, it) => {
    const lock = it.ex || T.done;
    const st = j => T.done && !it.ex ? (j === it.ans ? " right" : j === it.sel ? " wrong" : "") : "";
    const cut = cutOf(it);
    const btn = (j, inner, cls = "") => { const x = !T.done && cut.includes(j); return `<button class="ch${cls}${st(j)}${x ? " cut" : ""}" data-q="${it.id}" data-j="${j}" aria-pressed="${it.sel === j}"${lock || x ? " disabled" : ""}><span class="k">${K[j]}</span>${inner}</button>`; };
    const num = `<span class="qn">${it.ex ? 0 : it.n}.</span>`;
    const qp = it.pic ? `<span class="qp">${it.pic}</span>` : "";
    const hints = hintsHtml(it), mark = markHtml(it);
    let head, chs;
    if (p.lay === "pics") { head = `${num}<span class="qt">${it.q}</span>`; chs = `<div class="chs c3">${it.opts.map((o, j) => btn(j, o, " pico")).join("")}</div>`; }
    else if (p.lay === "words") { head = num + qp; chs = `<div class="chs c3">${it.opts.map((o, j) => btn(j, `<span>${esc(o)}</span>`)).join("")}</div>`; }
    else if (p.lay === "write") {
      const w = it.word;
      head = `${num}${qp}<span class="qt word">${esc(w.slice(0, it.at))}<span class="blank">${it.sel == null ? "&nbsp;" : it.opts[it.sel]}</span>${esc(w.slice(it.at + 1))}</span>`;
      chs = `<div class="chs c3">${it.opts.map((o, j) => btn(j, `<span>${o}</span>`, " big")).join("")}</div>`;
    } else if (p.lay === "gap") {
      // Chỗ trống hiện phần con đã chọn ("x / y" điền lần lượt vào hai chỗ trống)
      const fill = it.sel == null ? [] : it.opts[it.sel].split(" / ");
      head = `${num}<span class="qt">${esc(it.q).split("___").map((t, k) => k ? `<span class="blank gap">${fill[k - 1] ? esc(fill[k - 1]) : "&nbsp;"}</span>${t}` : t).join("")}</span>`;
      chs = `<div class="chs c3">${it.opts.map((o, j) => btn(j, `<span>${esc(o)}</span>`)).join("")}</div>`;
    } else {
      head = `${num}${qp}<span class="qt">${esc(it.q)}</span>`;
      chs = `<div class="chs${p.lay === "yn" ? " c2" : ""}">${it.opts.map((o, j) => btn(j, `<span>${esc(o)}</span>`)).join("")}</div>`;
    }
    return `<div class="q ${p.lay}${it.ex ? " ex" : ""}" data-id="${it.id}"><div class="qhead">${head}${mark}</div>${chs}${hints}</div>`;
  };
  const partHtml = (p, pi) => `<section class="paper">
    ${p.head ? `<div class="sec-h"><h3>${p.head}</h3></div>` : ""}
    <p class="instr">${p.no}. ${p.en} There is one example. <span class="pts">(${T.done ? score(p.items) : "……"}/${maxOf(p.items)} pts)</span>${S.vi ? `<small>${p.vi}</small>` : ""}</p>
    ${p.scene ? `<div class="scene-pic">${p.scene}</div>` : ""}
    ${p.lay === "bank" ? bankHtml(p, pi) : p.items.map(it => qHtml(p, it)).join("")}
  </section>`;

  $app.innerHTML = `
    <div class="top noprint"><button class="btn back" id="back">← Chọn bài</button><span class="grow"></span><button class="btn" id="print">🖨️ In đề</button><button class="btn sun" id="new">🔄 Đề khác</button></div>
    <div id="exam">
      <section class="paper xhead">
        <div><h2>PRACTICE TEST</h2><p class="xmeta">Môn Tiếng Anh · Lớp 1 · Thời gian làm bài: 40 phút<br>Explore Our World 1: tới ${eowName(T.eow)} · Sounds Great 1: tới Unit ${T.sg} (${letters[0].L.toUpperCase()}–${letters[letters.length - 1].L.toUpperCase()})<span class="noprint">${T.hints ? "" : " · Không dùng gợi ý"}</span></p></div>
        <label class="namebox">Họ và tên: <input id="nm" value="${esc(store.get("x:name", ""))}" autocomplete="off" spellcheck="false"></label>
        <div class="scores">${SECS.map(([k, t]) => `<div class="sc"><small>${t}</small><b>${T.done ? score(bySec(k)) : "…"}/${maxOf(bySec(k))}</b></div>`).join("")}<div class="sc tot"><small>Tổng điểm</small><b>${T.done ? total : "…"}/${max}</b></div></div>
        ${T.done ? `<div class="result"><div class="bigstars">${[1, 2, 3].map(i => `<span style="${i <= stars ? "" : "opacity:.2;filter:grayscale(1)"}">⭐</span>`).join("")}</div>
          <h3>${["", "Good try!", "Great job!", "Excellent!"][stars]}</h3>
          <p>${wrong ? `Con sai ${wrong} câu. Ô đỏ là con chọn sai, ô xanh là đáp án đúng.` : "Con làm đúng hết! Giỏi quá!"}</p>
          <p>${!T.hints ? "Con làm bài không có gợi ý, như thi thật." : usedHints ? `Con đã dùng ${usedHints} gợi ý (💡 cạnh câu hỏi). Lần sau thử làm ít gợi ý hơn nhé!` : "Con không cần gợi ý nào. Tuyệt vời!"}</p></div>` : ""}
      </section>
      ${T.parts.map((p, pi) => partHtml(p, pi)).join("")}
      <div class="xfoot noprint">${T.done
        ? `<button class="btn sun" id="new2">🔄 Làm đề khác</button><button class="btn primary" id="home2">Trang chủ</button>`
        : `<span class="xmeta" id="cnt"></span><button class="btn primary" id="submit" style="font-size:20px;padding:12px 26px">✅ Nộp bài</button>`}</div>
    </div>`;

  const sayHint = (it, k) => speakSeq(hintSegs(it.hints[k]));
  if (T.done) $app.querySelector("#exam").addEventListener("click", e => {
    const sb = e.target.closest(".say[data-hs]");
    if (sb) { const [i, k] = sb.dataset.hs.split(":"); sayHint(byId[i], +k); }
  });
  const fresh = () => go(() => examPage(makeExam(T.eow, T.sg)));
  document.getElementById("back").onclick = () => go(examSetup);
  document.getElementById("print").onclick = () => window.print();
  document.getElementById("new").onclick = async () => {
    if (T.done || real.every(i => i.sel == null) || await askBox({ ico: "🔄", title: "Làm đề khác?", text: "Bài đang làm sẽ bị bỏ đi.", no: "Làm tiếp", yes: "Đề khác" })) fresh();
  };
  document.getElementById("nm").oninput = e => store.set("x:name", e.target.value);
  if (T.done) {
    document.getElementById("new2").onclick = fresh;
    document.getElementById("home2").onclick = () => go(home);
    if (!T.saved) {
      T.saved = true;
      store.set("x:hist", [{ t: Date.now(), eow: T.eow, sg: T.sg, total, max, hints: usedHints, noHint: !T.hints }, ...store.get("x:hist", [])].slice(0, 20));
      if (stars >= 2) burst();
      speak(["", "Good try!", "Great job!", "Excellent!"][stars]);
    }
    return;
  }
  const cnt = document.getElementById("cnt");
  const count = () => cnt.textContent = `Đã làm ${real.filter(i => i.sel != null).length}/${real.length} câu`;
  count();
  const link = (p, it, j) => {
    p.items.forEach(o => { if (!o.ex && o.sel === j) o.sel = null; });
    it.sel = j; MS.q = MS.a = null;
  };
  document.getElementById("exam").onclick = async e => {
    const sb = e.target.closest(".say[data-hs]");
    if (sb) { const [i, k] = sb.dataset.hs.split(":"); sayHint(byId[i], +k); return; }
    const hb = e.target.closest(".hintb[data-h]");
    if (hb) {
      const it = byId[hb.dataset.h], hl = it.hl || 0;
      if (hl >= 3) return;
      if (hb.dataset.busy) return;
      hb.dataset.busy = 1;
      const ok = await askBox({ ico: "💡", title: `Xem gợi ý ${hl + 1}?`, text: `Câu ${it.n}: con nghĩ thêm một chút đã nhé. Nếu vẫn khó thì mở gợi ý.`, steps: [hl, 3], no: "Con tự làm", yes: "Xem gợi ý" });
      delete hb.dataset.busy;
      if (!ok || (it.hl || 0) !== hl) return;
      it.hl = hl + 1;
      const h = it.hints[hl], p = partOf[it.id];
      if (h.cut && h.cut.includes(it.sel)) it.sel = null;
      if (p.lay === "bank") { MS.q = it.id; MS.a = null; MS.pi = T.parts.indexOf(p); paintBank(MS.pi); }
      else hb.closest(".q").outerHTML = qHtml(p, it);
      sayHint(it, hl);
      count();
      return;
    }
    const mq = e.target.closest("[data-mq]"), ma = e.target.closest("[data-ma]");
    if (mq || ma) {
      const it = mq && byId[mq.dataset.mq], j = ma ? +ma.dataset.ma : null;
      if ((it && it.ex) || (ma && ma.disabled) || T.done) return;
      const pi = +(mq || ma).closest("[data-mg]").dataset.mg, p = T.parts[pi];
      if (MS.pi !== pi) { MS.q = MS.a = null; MS.pi = pi; }   // đang chọn dở ở bài khác thì bỏ
      if (it) {
        if (MS.a != null) link(p, it, MS.a);
        else MS.q = MS.q === it.id ? null : it.id;
      } else {
        const q = MS.q != null && byId[MS.q];
        if (q) { if (q.sel === j) { q.sel = null; MS.q = null; } else link(p, q, j); }
        else MS.a = MS.a === j ? null : j;
      }
      paintBank(pi);
      count();
      return;
    }
    const b = e.target.closest(".ch[data-q]");
    if (!b || b.disabled) return;
    const it = byId[b.dataset.q];
    it.sel = +b.dataset.j;
    b.parentElement.querySelectorAll(".ch").forEach(x => x.setAttribute("aria-pressed", x === b));
    if (partOf[it.id].lay === "gap") { b.closest(".q").outerHTML = qHtml(partOf[it.id], it); count(); return; }
    const blank = b.closest(".q").querySelector(".blank");
    if (blank) blank.textContent = it.opts[it.sel];
    count();
  };
  document.getElementById("exam").onkeydown = e => {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-mq][role=button]")) { e.preventDefault(); e.target.click(); }
  };
  document.getElementById("submit").onclick = async () => {
    const left = real.filter(i => i.sel == null).length;
    if (left && !await askBox({ ico: "✋", title: `Còn ${left} câu chưa làm`, text: "Con có muốn nộp bài luôn không?", no: "Làm tiếp", yes: "Nộp bài", yesCls: "primary" })) return;
    T.done = true;
    go(() => examPage(T));
  };
}

home();
</script>
